<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { font: 13px/1.45 system-ui, Segoe UI, sans-serif; width: 300px; margin: 12px; color: #1f2937; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  label { display: block; margin: 8px 0 4px; }
  textarea { width: 100%; box-sizing: border-box; height: 70px; font: 12px Consolas, monospace; }
  input[type=number] { width: 80px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .muted { color: #6b7280; font-size: 12px; }
  button { margin-top: 10px; padding: 6px 12px; border: 0; border-radius: 6px; background: #b56833; color: #fff; cursor: pointer; }
  #st { margin-top: 8px; font-weight: 600; }
</style>
</head>
<body>
  <h1>VPN Docker Proxy</h1>
  <div class="row"><input type="checkbox" id="on"><span>Aktif di profil Chrome ini</span></div>
  <label>Port SOCKS5 (127.0.0.1)</label>
  <input type="number" id="port" min="1" max="65535">
  <div class="row" style="margin-top:8px"><input type="checkbox" id="all"><span>Semua situs lewat VPN</span></div>
  <label>Domain lewat VPN (selain 10.x / 172.16-31.x / 192.168.x)</label>
  <textarea id="domains" placeholder="kantor.co.id&#10;intranet.local"></textarea>
  <button id="save">Simpan</button>
  <div id="st"></div>
  <p class="muted">Jalankan dulu: .\run_vpn_docker.ps1 -Name "&lt;profil&gt;". Kalau VPN mati, alamat internal dicoba langsung.</p>
  <script src="popup.js"></script>
</body>
</html>
