# Menerbitkan akar (versi terbaru) + /<versi>/ untuk tiap tag v2.0+ ke GitHub Pages.
# Perlu: Settings > Pages > Source = "GitHub Actions".
name: Pages
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # semua tag dan riwayat dibutuhkan untuk git archive per versi
      - run: bash scripts/build-pages.sh _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
